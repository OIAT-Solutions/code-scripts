x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/scheduler/Dockerfile
  image: oiat-portal:latest
  working_dir: /app
  env_file:
    - ${OIAT_ENV_FILE:-.env}
  environment:
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
    STATE_ROOT: /data
    OIAT_COMPANIES_DIR: /data/code_scripts/companies
  volumes:
    - app-data:/data
  restart: unless-stopped
  init: true

services:
  bootstrap:
    <<: *app-common
    profiles: ["bootstrap"]
    command:
      - /bin/sh
      - -lc
      - echo "Bootstrap seed complete."
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      STATE_ROOT: /data
      OIAT_COMPANIES_DIR: /data/code_scripts/companies
      SEED_ROOT: /seed
    volumes:
      - app-data:/data
      - .:/seed:ro
    restart: "no"

  web:
    <<: *app-common
    container_name: ${COMPOSE_PROJECT_NAME:-oiat}-web
    command:
      - /bin/sh
      - -lc
      - python manage.py migrate --noinput && exec gunicorn oiat_portal.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-180} --access-logfile - --error-logfile -
    expose:
      - "8000"

  scheduler:
    <<: *app-common
    container_name: ${COMPOSE_PROJECT_NAME:-oiat}-scheduler
    command: ["python", "manage.py", "run_schedule_worker"]
    depends_on:
      - web
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      STATE_ROOT: /data
      OIAT_COMPANIES_DIR: /data/code_scripts/companies
      OIAT_SCHEDULER_POLL_SECONDS: ${OIAT_SCHEDULER_POLL_SECONDS:-15}
      OIAT_SCHEDULER_ENABLE_ENV_FALLBACK: ${OIAT_SCHEDULER_ENABLE_ENV_FALLBACK:-1}
      # Company A remains excluded from the system fallback until W9 approval.
      OIAT_COMPANY_A_SALES_AUTOMATION_ENABLED: ${OIAT_COMPANY_A_SALES_AUTOMATION_ENABLED:-0}
      # OIAT_COMPANY_A_DAILY_RUN_ENABLED also comes from env_file (.env): when 1, this worker
      # never schedules Company A (the akponora-ops daily run owns it; no double runs).
      # Standing auto-approval also needs OIAT_COMPANY_A_STANDING_APPROVAL_REF (and optionally
      # OIAT_COMPANY_A_AUTO_APPROVAL_MAX_GROSS). They come from env_file (.env) on purpose:
      # not listed here so an empty interpolation can never blank them.
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 18 * * *}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-Africa/Lagos}

  # Company A operations (docs/SERVER_SETUP.md). Opt-in profile: set COMPOSE_PROFILES=akponora-ops
  # in .env (or `docker compose --profile akponora-ops up -d akponora-ops`). With
  # OIAT_COMPANY_A_DAILY_RUN_ENABLED=1 it runs the single Company A routine
  # (`python -m code_scripts.akponora_ops.daily_run`: catalogue -> vendors+bills -> sales -> guard -> uf deposits)
  # at OIAT_COMPANY_A_DAILY_RUN_CRON (default "0 6 * * *", SCHEDULE_TZ). Individual job crons
  # (OIAT_AKPONORA_<JOB>_CRON) are ignored while the daily run is on. Every QBO write still needs
  # its own approval env vars. Idle (no restart loop) when nothing is switched on.
  akponora-ops:
    <<: *app-common
    profiles: ["akponora-ops"]
    container_name: ${COMPOSE_PROJECT_NAME:-oiat}-akponora-ops
    command: ["python", "-m", "code_scripts.akponora_ops.ops_scheduler"]

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    image: oiat-caddy:latest
    container_name: ${COMPOSE_PROJECT_NAME:-oiat}-caddy
    depends_on:
      - web
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}
    ports:
      - "${TAILSCALE_BIND_IP:?set TAILSCALE_BIND_IP in .env}:443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    init: true

  # Public ingress for inbound QuickBooks Online webhooks only.
  # The portal itself stays tailnet-only (Caddy binds to TAILSCALE_BIND_IP); Intuit
  # cannot reach a Tailscale CGNAT address, so the webhook endpoint is exposed via a
  # Cloudflare Tunnel on a dedicated public hostname (qbo-webhooks.oiatsolutions.com).
  # This connector runs in the compose network and reaches Django directly at
  # http://web:8000. The public-hostname route and path restriction
  # (Path = epos-qbo/webhooks/quickbooks) are configured on the tunnel in the
  # Cloudflare Zero Trust dashboard; this container only needs the tunnel token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME:-oiat}-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}"]
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app-data:
  caddy_data:
  caddy_config:
