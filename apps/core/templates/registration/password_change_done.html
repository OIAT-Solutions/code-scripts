{% extends "base.html" %}

{% block title %}Password changed • OIAT Portal{% endblock %}


{% block content %}
<div class="max-w-md">
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
        <div class="flex items-center gap-3 text-emerald-700">
            <iconify-icon icon="solar:check-circle-linear" width="24"></iconify-icon>
            <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">Password updated</h1>
        </div>
        <p class="mt-2 text-sm text-slate-600">Your password has been changed. Use your new password the next time you sign in.</p>
        <a href="{% url 'core-account' %}" class="btn btn-primary mt-6">Back to account</a>
    </div>
</div>
{% endblock %}
