{% comment %}One way to start a run for any company (views_run.py). Opened by any element with data-open-run.{% endcomment %}
{{ run_options|json_script:"run-options" }}{{ run_prefill|json_script:"run-prefill" }}
<style>#run-dialog{margin:auto}#run-dialog::backdrop{background:rgb(2 6 23 / .55)}</style>
<dialog id="run-dialog" aria-labelledby="run-dialog-title" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 p-0 shadow-xl"
        x-data="runDialog('{{ run_default_day }}')">
<form method="get" action="{% url 'epos_qbo:run-review' %}" class="p-6 space-y-5">
<div class="flex items-start justify-between gap-4"><div><h2 id="run-dialog-title" class="text-lg font-semibold">Start a run</h2><p class="portal-muted mt-1">You'll see exactly what will happen before anything starts.</p></div>
<button type="button" class="btn btn-secondary px-3" aria-label="Close" onclick="this.closest('dialog').close()">✕</button></div>
<label class="block text-sm font-medium">Company<select name="company" required x-model="company" @change="step = steps[0] ? steps[0][0] : ''" class="portal-input mt-2 w-full"><option value="">Choose a company</option>{% for key, opt in run_options.items %}<option value="{{ key }}">{{ opt.name }}</option>{% endfor %}</select></label>
<label class="block text-sm font-medium">Business day<input type="date" name="date" required x-model="day" max="{{ run_default_day }}" min="2026-10-01" class="portal-input mt-2 w-full"><span class="portal-muted block mt-1 font-normal">A business day closes at 05:00 Lagos time.</span></label>
<label class="block text-sm font-medium" x-show="company" x-cloak>What to run<select name="only" x-model="step" class="portal-input mt-2 w-full"><template x-for="s in steps" :key="s[0]"><option :value="s[0]" x-text="s[1]" :selected="s[0] === step"></option></template></select></label>
<fieldset x-show="company" x-cloak class="space-y-2"><legend class="text-sm font-medium">Mode</legend>
<template x-if="preview"><div class="space-y-2"><label class="flex items-start gap-3 text-sm"><input type="radio" name="mode" value="dry" x-model="mode" class="mt-1"><span><span class="font-medium">Preview</span><span class="portal-muted block">Shows what would be posted. Nothing is posted.</span></span></label>
<label class="flex items-start gap-3 text-sm"><input type="radio" name="mode" value="post" x-model="mode" class="mt-1"><span><span class="font-medium">Post to QuickBooks</span><span class="portal-muted block">Runs it for real, through the usual checks.</span></span></label></div></template>
<template x-if="!preview"><p class="portal-muted text-sm"><input type="hidden" name="mode" value="post">Sales sync posts to QuickBooks. The next page shows what will run before it starts.</p></template>
</fieldset>
<div class="flex justify-end gap-3 pt-1"><button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">Cancel</button><button type="submit" class="btn btn-primary" :disabled="!company">Review</button></div>
</form>
</dialog>
<script>
function runDialog(defaultDay) {
  const options = JSON.parse(document.getElementById("run-options").textContent);
  const prefill = JSON.parse(document.getElementById("run-prefill").textContent);
  return {
    company: prefill.company || "", day: prefill.day || defaultDay, mode: "dry", step: "",
    get steps() { return (options[this.company] || {}).steps || []; },
    get preview() { return !!(options[this.company] || {}).preview; },
    init() {
      this.step = prefill.step || (this.steps[0] ? this.steps[0][0] : "");
      if (prefill.open) this.$nextTick(() => this.$el.showModal());
    },
  };
}
document.addEventListener("click", (e) => {
  const opener = e.target.closest("[data-open-run]");
  if (opener) { e.preventDefault(); document.getElementById("run-dialog").showModal(); }
});
</script>
