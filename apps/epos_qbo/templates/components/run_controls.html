    {% if perms.epos_qbo.can_trigger_runs %}
    {% comment %}
    Manual sales run for the other companies (inside components/run_panel.html).
    {% endcomment %}
    <div id="sales-run-panel" x-data="runTriggerForm()">
        <form method="post" action="{% url 'epos_qbo:run-trigger' %}" class="space-y-4" onsubmit="return confirm('This will send sales for the selected company and dates to QuickBooks. Continue?');">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <label class="text-xs text-slate-600 dark:text-slate-400">
                    Scope
                    <select name="scope" x-model="scope" class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                        <option value="single_company">One company</option>
                    </select>
                </label>
                <label class="text-xs text-slate-600 dark:text-slate-400" x-show="scope === 'single_company'" x-cloak>
                    Company
                    <select name="company_key" :required="scope === 'single_company'" :disabled="scope !== 'single_company'" class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                        <option value="">Select company</option>
                        {% for company in companies %}
                        {% if company.company_key != "company_a" %}<option value="{{ company.company_key }}">{{ company.display_name }}</option>{% endif %}
                        {% endfor %}
                    </select>
                </label>
                <label class="text-xs text-slate-600 dark:text-slate-400">
                    Dates
                    <select name="date_mode" x-model="dateMode" class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                        <option value="yesterday">Yesterday</option>
                        <option value="target_date">One day</option>
                        <option value="range">Past dates</option>
                    </select>
                </label>
                <div class="flex items-end">
                    <button type="submit" class="btn btn-primary w-full justify-center">
                        Review and run
                    </button>
                </div>
            </div>

            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="summaryText"></p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" x-show="dateMode === 'target_date'" x-cloak>
                <label class="text-xs text-slate-600 dark:text-slate-400">
                    One day
                    <input type="date" name="target_date" :required="dateMode === 'target_date'" :disabled="dateMode !== 'target_date'"
                        class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" x-show="dateMode === 'range'" x-cloak>
                <label class="text-xs text-slate-600 dark:text-slate-400">
                    From Date
                    <input type="date" name="from_date" :required="dateMode === 'range'" :disabled="dateMode !== 'range'"
                        class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                </label>
                <label class="text-xs text-slate-600 dark:text-slate-400">
                    To Date
                    <input type="date" name="to_date" :required="dateMode === 'range'" :disabled="dateMode !== 'range'"
                        class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                </label>
                <label class="text-xs text-slate-600 dark:text-slate-400 flex items-center gap-2 mt-6">
                    <input type="checkbox" name="skip_download" :disabled="dateMode !== 'range'">
                    Use saved sales files
                </label>
            </div>

            <details class="border border-slate-200 dark:border-slate-600 rounded-lg p-3" x-show="scope === 'all_companies'" x-cloak>
                <summary class="cursor-pointer text-sm font-medium text-slate-700 dark:text-slate-300 select-none">Advanced options (all companies)</summary>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-3">
                    <label class="text-xs text-slate-600 dark:text-slate-400">
                        Parallel workers
                        <input type="number" name="parallel" min="1" value="{{ default_parallel }}" :disabled="scope !== 'all_companies'"
                            class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                    </label>
                    <label class="text-xs text-slate-600 dark:text-slate-400">
                        Stagger seconds
                        <input type="number" name="stagger_seconds" min="0" value="{{ default_stagger_seconds }}" :disabled="scope !== 'all_companies'"
                            class="mt-1 w-full border border-slate-200 dark:border-slate-600 rounded-md px-2 py-1.5 text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                    </label>
                    <label class="text-xs text-slate-600 dark:text-slate-400 flex items-center gap-2 mt-6">
                        <input type="checkbox" name="continue_on_failure" :disabled="scope !== 'all_companies'">
                        Continue on failure
                    </label>
                </div>
            </details>
        </form>
    </div>
    {% endif %}
