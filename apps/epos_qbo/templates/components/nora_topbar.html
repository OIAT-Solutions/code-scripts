<div class="nora-topbar-wrap">
<header class="nora-topbar"><button type="button" id="nora-menu" class="nora-icon-button nora-menu" aria-label="Open navigation" aria-expanded="false"><iconify-icon icon="solar:hamburger-menu-linear" width="21" aria-hidden="true"></iconify-icon></button>
<div class="nora-header-title">{{ company_tab_label }}</div><div class="nora-header-right"><span class="nora-timezone">Lagos · WAT (UTC+1)</span><span class="nora-operator">OIAT operator</span>
