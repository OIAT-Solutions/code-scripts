{# Status chip for Company A daily-run statuses. Vars: status, text (optional), icon (optional) #}
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border {% if status == 'ok' %}bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-700{% elif status == 'review' %}bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-800{% elif status == 'failed' or status == 'unreadable' %}bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-400 border-red-200 dark:border-red-800{% else %}bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600{% endif %}">{% if icon %}<span aria-hidden="true">{{ icon }}</span>{% endif %}{{ text|default:status }}</span>
