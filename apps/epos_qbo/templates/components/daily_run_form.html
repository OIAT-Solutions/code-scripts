{% with run_date=request.GET.run_date run_step=request.GET.run_step %}<form method="get" action="{% url 'epos_qbo:attention-confirm' %}" class="flex flex-wrap items-end gap-4">
<input type="hidden" name="action" value="daily">
<label class="text-sm font-medium">Business day<input class="portal-input mt-2" type="date" name="date" min="2026-10-01" value="{{ run_date|default:'' }}"></label>
<label class="text-sm font-medium">What to run<select class="portal-input mt-2" name="only">{% for value, label in daily_step_choices %}<option value="{{ value }}" {% if run_step == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label class="text-sm font-medium">Mode<select class="portal-input mt-2" name="mode"><option value="dry">Preview · nothing is posted</option><option value="post">Post to QuickBooks</option></select></label><button class="btn btn-primary" type="submit">Review run</button>
<p class="portal-muted w-full">Leave the day blank for the last closed business day. Banking also picks up any earlier day that is now ready.</p>
</form>{% endwith %}
