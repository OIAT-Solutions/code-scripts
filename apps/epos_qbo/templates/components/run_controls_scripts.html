
{% load static %}
{{ categories_by_company|json_script:"inventory-categories-by-company" }}
<script>
    function runTriggerForm() {
        return {
            scope: "single_company",
            dateMode: "yesterday",
            get summaryText() {
                const scopeText = this.scope === "all_companies" ? "eligible companies (Akponora excluded)" : "one selected company";
                if (this.dateMode === "yesterday") {
                    return `This will run for ${scopeText} using yesterday's business date.`;
                }
                if (this.dateMode === "target_date") {
                    return `This will run for ${scopeText} using one specific target date.`;
                }
                return `This will run for ${scopeText} across a date range.`;
            },
        };
    }

    function inventoryForm() {
        const dataEl = document.getElementById("inventory-categories-by-company");
        return {
            companyKey: "",
            category: "",
            categoriesByCompany: dataEl ? JSON.parse(dataEl.textContent) : {},
            get availableCategories() {
                if (!this.companyKey) return [];
                const list = this.categoriesByCompany[this.companyKey];
                return Array.isArray(list) ? list : [];
            },
        };
    }
</script>
<script src="{% static 'js/runs.js' %}"></script>
